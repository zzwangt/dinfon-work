services:
  app:
    build: ..
    image: dinfon-work:local
    user: "${DINFON_UID:-1000}:${DINFON_GID:-1000}"
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: "true"
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN:?请先配置 config/deploy.env 中的正式域名}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
